name: Deploy website

on: 
  push:
    branches:
      - chore/FF-12

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json

      - name: Install Netlify
        run: npm install netlify-cli@17.10.1 -g

      - name: Install Dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to Netlify
        id: netlify_deploy
        run: |
          netlify deploy \
            --dir dist \
            --site ceef7419-f372-4745-94d7-6c886f841f23 \
            --auth ${{ secrets.NETLIFY_AUTH_TOKEN }}