name: CI

on:
  pull_request:
    branches:
      - '**'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean install workaround for rollup native
        run: |
          rm -rf node_modules package-lock.json

      - name: Install deps
        run: npm install --force

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          CI: true # This ensures the process exits with a non-zero code if tests fail
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_EXPIRATION_HOURS: ${{ secrets.VITE_EXPIRATION_HOURS }}
          VITE_MIN_AMOUNT: ${{ secrets.VITE_MIN_AMOUNT }}
          VITE_MAX_AMOUNT: ${{ secrets.VITE_MAX_AMOUNT }}
          VITE_EVM_CONFIRMATIONS: ${{ secrets.VITE_EVM_CONFIRMATIONS }}
          VITE_EVM_CONFIRMATIONS_USD_AMOUNT: ${{ secrets.VITE_EVM_CONFIRMATIONS_USD_AMOUNT }}
          VITE_BTC_CONFIRMATIONS: ${{ secrets.VITE_BTC_CONFIRMATIONS }}
          VITE_DEFAULT_POSITION_ID: ${{ secrets.VITE_DEFAULT_POSITION_ID }}

      - name: Build
        run: npm run build
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_EXPIRATION_HOURS: ${{ secrets.VITE_EXPIRATION_HOURS }}
          VITE_MIN_AMOUNT: ${{ secrets.VITE_MIN_AMOUNT }}
          VITE_MAX_AMOUNT: ${{ secrets.VITE_MAX_AMOUNT }}
          VITE_EVM_CONFIRMATIONS: ${{ secrets.VITE_EVM_CONFIRMATIONS }}
          VITE_EVM_CONFIRMATIONS_USD_AMOUNT: ${{ secrets.VITE_EVM_CONFIRMATIONS_USD_AMOUNT }}
          VITE_BTC_CONFIRMATIONS: ${{ secrets.VITE_BTC_CONFIRMATIONS }}
          VITE_DEFAULT_POSITION_ID: ${{ secrets.VITE_DEFAULT_POSITION_ID }}