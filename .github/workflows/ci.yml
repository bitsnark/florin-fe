name: CI

on:
  pull_request:
    branches:
      - '**'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install deps
        working-directory: florin-fe
        run: npm install

      - name: Lint
        working-directory: florin-fe
        run: npm run lint

      - name: Build
        working-directory: florin-fe
        run: npm run build
